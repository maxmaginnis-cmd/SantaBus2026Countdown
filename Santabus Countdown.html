<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snowy Countdown</title>
    <style>
        body {
            font-family: Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #E21518;
            overflow: hidden;
            position: relative;
        }
        #timer {
            font-size: 3rem;
            color: #ffffff;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        /* Snowflakes */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #FFFFFF;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0);
            }
            100% {
                transform: translateY(105vh) translateX(20px);
            }
        }
    </style>
</head>
<body>

    <div id="timer">Loading...</div>

    <script>
        // Create falling snow effect
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // Random size, starting position, and speed
            const size = Math.random() * 5 + 2 + 'px';
            snowflake.style.width = size;
            snowflake.style.height = size;
            snowflake.style.left = Math.random() * window.innerWidth + 'px';
            
            const duration = Math.random() * 3 + 2; // Between 2s and 5s
            snowflake.style.animationDuration = duration + 's';
            
            document.body.appendChild(snowflake);

            // Remove snowflake after it falls
            setTimeout(() => {
                snowflake.remove();
            }, duration * 1000);
        }

        // Generate snowflakes continuously
        setInterval(createSnowflake, 10);

        // Countdown Timer Logic
        const targetDate = new Date("November 30, 2026 17:45:00").getTime();

        const countdownInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("timer").innerHTML = "EXPIRED";
            } else {
                document.getElementById("timer").innerHTML = 
                    days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
            }
        }, 1000);
    </script>

</body>
</html>
